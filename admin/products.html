<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — FreshCart Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{emerald:{50:'#ecfdf5',100:'#d1fae5',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'}},fontFamily:{sans:['Plus Jakarta Sans','Inter','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans">
<div id="toast-container"></div>
<div class="flex h-screen overflow-hidden">
  <!-- SIDEBAR -->
  <aside class="w-64 flex-shrink-0 bg-slate-900 flex flex-col h-full overflow-y-auto">
    <div class="p-5 border-b border-slate-800 flex items-center gap-3">
      <img src="../assets/images/logo.png" alt="FreshCart Admin" class="h-11 w-auto max-h-11 object-contain bg-white/10 p-1.5 rounded-xl">
      <div>
        <div class="text-lg font-black text-white leading-none">Fresh<span class="text-emerald-400">Cart</span></div>
        <div class="text-[10px] text-slate-400 font-medium mt-1">Admin Control Panel</div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard</a>
      <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold bg-emerald-700 text-white"><i data-lucide="package" class="w-4 h-4"></i> Products</a>
      <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="grid-3x3" class="w-4 h-4"></i> Categories</a>
      <a href="orders.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="shopping-cart" class="w-4 h-4"></i> Orders</a>
      <a href="customers.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="users" class="w-4 h-4"></i> Customers</a>
      <a href="inventory.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="warehouse" class="w-4 h-4"></i> Inventory</a>
      <a href="coupons.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="ticket" class="w-4 h-4"></i> Coupons</a>
      <a href="reviews.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="star" class="w-4 h-4"></i> Reviews</a>
      <a href="payments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="credit-card" class="w-4 h-4"></i> Payments</a>
      <a href="delivery.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="truck" class="w-4 h-4"></i> Delivery</a>
      <a href="reports.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Reports</a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800"><i data-lucide="settings" class="w-4 h-4"></i> Settings</a>
    </nav>
    <div class="p-3 border-t border-slate-800"><button onclick="doLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-red-900/40 hover:text-red-400"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button></div>
  </aside>
  <!-- MAIN -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between flex-shrink-0">
      <div><h1 class="text-base font-extrabold text-slate-900">Products</h1><p class="text-xs text-slate-400">Manage your product catalog</p></div>
      <button onclick="window.adminDash.openAddProduct()" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i> Add Product
      </button>
    </header>
    <main class="flex-1 overflow-y-auto p-6">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-xs">
        <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input id="admin-product-search" type="text" placeholder="Search by name, SKU, brand…" class="w-full pl-10 pr-4 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400">
          </div>
          <select id="admin-product-cat-filter" class="px-3 py-2 text-xs border border-slate-200 rounded-xl bg-white font-semibold focus:outline-none">
            <option value="all">All Categories</option>
            <option value="fruits">Fruits</option>
            <option value="vegetables">Vegetables</option>
            <option value="dairy">Dairy & Eggs</option>
            <option value="bakery">Bakery</option>
            <option value="meat-seafood">Meat & Seafood</option>
            <option value="snacks">Snacks</option>
            <option value="beverages">Beverages</option>
            <option value="rice-grains">Rice & Grains</option>
            <option value="cooking-essentials">Cooking Essentials</option>
            <option value="frozen-foods">Frozen Foods</option>
            <option value="personal-care">Personal Care</option>
            <option value="household">Household</option>
          </select>
          <span id="admin-products-count" class="text-xs font-semibold text-slate-500 self-center whitespace-nowrap"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50">
              <tr class="text-left text-[10px] font-bold text-slate-500 uppercase tracking-wider">
                <th class="py-3 px-4">Product</th><th class="py-3 px-4">Category</th><th class="py-3 px-4">Brand</th>
                <th class="py-3 px-4">Price</th><th class="py-3 px-4">Discount</th><th class="py-3 px-4">Stock</th>
                <th class="py-3 px-4">Status</th><th class="py-3 px-4">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-products-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ADD/EDIT PRODUCT MODAL -->
<div id="admin-product-form-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 modal-backdrop" onclick="window.adminDash.closeModal('admin-product-form-modal')"></div>
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="sticky top-0 bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between rounded-t-3xl">
      <h3 id="product-modal-title" class="font-extrabold text-slate-900">Add Product</h3>
      <button onclick="window.adminDash.closeModal('admin-product-form-modal')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <form id="admin-product-form" onsubmit="window.adminDash.saveProduct(event)" class="p-6 space-y-4">
      <input type="hidden" id="pf-id">
      <div class="flex gap-4">
        <div class="w-24 h-24 flex-shrink-0 rounded-2xl overflow-hidden border border-slate-200 bg-slate-50">
          <img id="pf-img-preview" src="" alt="Preview" class="w-full h-full object-cover">
        </div>
        <div class="flex-1">
          <label class="text-xs font-bold text-slate-700 block mb-1.5">Image URL</label>
          <input id="pf-image" type="url" placeholder="https://images.unsplash.com/…" onchange="document.getElementById('pf-img-preview').src=this.value" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2"><label class="text-xs font-bold text-slate-700 block mb-1">Product Name *</label><input id="pf-name" type="text" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">SKU</label><input id="pf-sku" type="text" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Brand</label><input id="pf-brand" type="text" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Category *</label>
          <select id="pf-category" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400">
            <option value="fruits">Fruits</option><option value="vegetables">Vegetables</option><option value="dairy">Dairy & Eggs</option>
            <option value="bakery">Bakery</option><option value="meat-seafood">Meat & Seafood</option><option value="snacks">Snacks</option>
            <option value="beverages">Beverages</option><option value="rice-grains">Rice & Grains</option>
            <option value="cooking-essentials">Cooking Essentials</option><option value="frozen-foods">Frozen Foods</option>
            <option value="personal-care">Personal Care</option><option value="household">Household</option>
          </select>
        </div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Unit</label><input id="pf-unit" type="text" placeholder="e.g. 1 kg, 500 ml" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Sale Price (₹) *</label><input id="pf-price" type="number" min="0" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">MRP (₹)</label><input id="pf-mrp" type="number" min="0" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Discount %</label><input id="pf-discount" type="number" min="0" max="90" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Stock Qty *</label><input id="pf-stock" type="number" min="0" required class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div><label class="text-xs font-bold text-slate-700 block mb-1">Min Stock (alert)</label><input id="pf-minstock" type="number" min="0" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400"></div>
        <div class="col-span-2"><label class="text-xs font-bold text-slate-700 block mb-1">Description</label><textarea id="pf-desc" rows="3" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-400 resize-none"></textarea></div>
      </div>
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" onclick="window.adminDash.closeModal('admin-product-form-modal')" class="px-5 py-2.5 border border-slate-200 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-50">Cancel</button>
        <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold">Save Product</button>
      </div>
    </form>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div id="admin-delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 modal-backdrop" onclick="window.adminDash.closeModal('admin-delete-modal')"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full">
    <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><i data-lucide="trash-2" class="w-6 h-6 text-red-500"></i></div>
    <h3 class="text-center font-extrabold text-slate-900 mb-1">Delete Product?</h3>
    <p class="text-center text-xs text-slate-500 mb-5">"<span id="admin-delete-name"></span>" will be permanently removed.</p>
    <div class="flex gap-3">
      <button onclick="window.adminDash.closeModal('admin-delete-modal')" class="flex-1 py-2.5 border border-slate-200 text-slate-700 rounded-xl text-xs font-bold">Cancel</button>
      <button onclick="window.adminDash.confirmDelete()" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Delete</button>
    </div>
  </div>
</div>

<!-- ORDER DETAIL MODAL (shared) -->
<div id="admin-order-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 modal-backdrop" onclick="document.getElementById('admin-order-modal').classList.add('hidden')"></div>
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <button onclick="document.getElementById('admin-order-modal').classList.add('hidden')" class="absolute top-4 right-4 p-2 bg-slate-100 hover:bg-slate-200 rounded-xl"><i data-lucide="x" class="w-4 h-4"></i></button>
    <div id="admin-order-modal-content"></div>
  </div>
</div>

<script src="../js/data.js"></script><script src="../js/api.js"></script><script src="../js/cart.js"></script><script src="../js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{lucide.createIcons();if(!window.freshCartAPI.isAdminAuthenticated()){window.location.href='login.html';return;}window.adminDash.init();window.adminDash.renderProductsTable();});
function doLogout(){window.freshCartAPI.logoutAdmin();showToast('Logged out.','info');setTimeout(()=>window.location.href='login.html',600);}</script>
</body></html>
