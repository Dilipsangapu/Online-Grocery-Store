<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — FreshCart</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{emerald:{50:'#ecfdf5',100:'#d1fae5',500:'#10b981',600:'#059669',700:'#047857',900:'#064e3b'}},fontFamily:{sans:['Plus Jakarta Sans','Inter','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-900 min-h-screen flex items-center justify-center p-4 font-sans">
<div id="toast-container"></div>

<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-8">
    <img src="../assets/images/logo.png" alt="FreshCart Admin Logo" class="h-20 w-auto max-h-20 mx-auto mb-3 object-contain bg-white/10 p-2.5 rounded-2xl shadow-sm">
    <h1 class="text-2xl font-black text-white">Fresh<span class="text-emerald-400">Cart</span></h1>
    <p class="text-slate-400 text-sm mt-1 font-medium">Admin Control Panel</p>
  </div>
  <!-- Login Card -->
  <div class="bg-white rounded-3xl p-8 shadow-2xl">
    <h2 class="text-lg font-extrabold text-slate-900 mb-1">Welcome back</h2>
    <p class="text-xs text-slate-500 mb-6">Sign in to manage your store</p>
    <div id="login-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl"></div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input id="admin-email" type="email" value="admin@freshcart.com" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-50">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
          <input id="admin-password" type="password" value="admin123" class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-50">
        </div>
      </div>
      <button id="login-btn" onclick="doLogin()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-md">
        <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Dashboard
      </button>
    </div>
    <p class="text-center text-xs text-slate-400 mt-5">Demo: admin@freshcart.com / admin123</p>
    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="../index.html" class="text-xs font-semibold text-slate-500 hover:text-emerald-600 flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Customer Store
      </a>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  if (window.freshCartAPI.isAdminAuthenticated()) window.location.href = 'dashboard.html';
  document.getElementById('admin-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});
function doLogin() {
  const email = document.getElementById('admin-email').value;
  const password = document.getElementById('admin-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  setTimeout(() => {
    const r = window.freshCartAPI.loginAdmin(email, password);
    if (r.success) {
      showToast('Welcome to admin panel!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 700);
    } else {
      errEl.textContent = r.message || 'Invalid credentials.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Dashboard';
      lucide.createIcons();
    }
  }, 600);
}
</script>
</body>
</html>
