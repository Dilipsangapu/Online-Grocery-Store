<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — FreshCart</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{emerald:{50:'#ecfdf5',100:'#d1fae5',500:'#10b981',600:'#059669',700:'#047857',900:'#064e3b'}},fontFamily:{sans:['Plus Jakarta Sans','Inter','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans">
<div id="toast-container"></div>
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center h-20 gap-4">
    <a href="index.html" class="flex items-center gap-3 group">
      <img src="assets/images/logo.png" alt="FreshCart Logo" class="h-12 sm:h-14 w-auto object-contain group-hover:scale-105 transition-transform duration-200">
      <div class="flex flex-col leading-none">
        <span class="text-xl sm:text-2xl font-black text-emerald-700 tracking-tight">Fresh<span class="text-slate-900">Cart</span></span>
        <span class="text-[11px] text-slate-500 font-semibold tracking-tight mt-0.5">Fresh groceries, delivered.</span>
      </div>
    </a>
    <div class="mx-auto hidden sm:flex items-center gap-2 text-xs font-semibold">
      <span class="text-emerald-700 font-bold">Cart</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i>
      <span class="text-slate-900 font-bold">Checkout</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400"></i>
      <span class="text-slate-400">Confirmation</span>
    </div>
    <div class="ml-auto flex items-center gap-1.5 text-xs text-slate-500">
      <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Secure Checkout
    </div>
  </div>
</nav>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- FORM -->
    <div class="lg:col-span-2 space-y-5">
      <!-- Customer Info -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
        <h2 class="text-base font-extrabold text-slate-900 mb-5 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5 text-emerald-600"></i>Customer Information</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Full Name *</label>
            <input id="co-name" type="text" placeholder="e.g. Dileep Kumar" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-50">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Mobile Number *</label>
            <input id="co-phone" type="tel" placeholder="+91 98490 12345" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Email Address</label>
            <input id="co-email" type="email" placeholder="you@example.com" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>
      <!-- Delivery Address -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
        <h2 class="text-base font-extrabold text-slate-900 mb-5 flex items-center gap-2"><i data-lucide="map-pin" class="w-5 h-5 text-emerald-600"></i>Delivery Address</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs font-bold text-slate-700 mb-1.5">House / Flat / Building *</label>
            <input id="co-address" type="text" placeholder="e.g. Flat 402, Sri Krishna Heights" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">City *</label>
            <input id="co-city" type="text" placeholder="e.g. Tirupati" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">State</label>
            <input id="co-state" type="text" placeholder="e.g. Andhra Pradesh" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">Pincode *</label>
            <input id="co-pincode" type="text" placeholder="517501" maxlength="6" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400">
          </div>
        </div>
      </div>
      <!-- Delivery Slot -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
        <h2 class="text-base font-extrabold text-slate-900 mb-5 flex items-center gap-2"><i data-lucide="clock" class="w-5 h-5 text-emerald-600"></i>Delivery Slot</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 transition-colors has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
            <input type="radio" name="delivery-slot" value="30–60 minutes" class="accent-emerald-600" checked>
            <i data-lucide="zap" class="w-4 h-4 text-emerald-600"></i>
            <div><div class="text-xs font-bold text-slate-900">Express Delivery</div><div class="text-[11px] text-slate-500">30–60 minutes</div></div>
          </label>
          <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 transition-colors has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
            <input type="radio" name="delivery-slot" value="1–2 hours" class="accent-emerald-600">
            <i data-lucide="truck" class="w-4 h-4 text-emerald-600"></i>
            <div><div class="text-xs font-bold text-slate-900">Fast Delivery</div><div class="text-[11px] text-slate-500">1–2 hours</div></div>
          </label>
          <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 transition-colors has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
            <input type="radio" name="delivery-slot" value="Today Evening (5-7 PM)" class="accent-emerald-600">
            <i data-lucide="sun-medium" class="w-4 h-4 text-amber-500"></i>
            <div><div class="text-xs font-bold text-slate-900">Today Evening</div><div class="text-[11px] text-slate-500">5:00 PM – 7:30 PM</div></div>
          </label>
          <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 transition-colors has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50">
            <input type="radio" name="delivery-slot" value="Tomorrow Morning (7-9 AM)" class="accent-emerald-600">
            <i data-lucide="sunrise" class="w-4 h-4 text-amber-500"></i>
            <div><div class="text-xs font-bold text-slate-900">Tomorrow Morning</div><div class="text-[11px] text-slate-500">7:00 AM – 9:30 AM</div></div>
          </label>
        </div>
      </div>
      <!-- Payment -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
        <h2 class="text-base font-extrabold text-slate-900 mb-5 flex items-center gap-2"><i data-lucide="credit-card" class="w-5 h-5 text-emerald-600"></i>Payment Method</h2>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <label class="flex flex-col items-center gap-2 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 transition-colors">
            <input type="radio" name="payment-method" value="UPI" class="accent-emerald-600" checked>
            <i data-lucide="smartphone" class="w-6 h-6 text-emerald-600"></i>
            <span class="text-xs font-bold">UPI</span>
          </label>
          <label class="flex flex-col items-center gap-2 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 transition-colors">
            <input type="radio" name="payment-method" value="Credit/Debit Card" class="accent-emerald-600">
            <i data-lucide="credit-card" class="w-6 h-6 text-blue-600"></i>
            <span class="text-xs font-bold">Card</span>
          </label>
          <label class="flex flex-col items-center gap-2 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 transition-colors">
            <input type="radio" name="payment-method" value="Net Banking" class="accent-emerald-600">
            <i data-lucide="landmark" class="w-6 h-6 text-amber-600"></i>
            <span class="text-xs font-bold">Net Banking</span>
          </label>
          <label class="flex flex-col items-center gap-2 p-4 border border-slate-200 rounded-2xl cursor-pointer hover:border-emerald-400 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50 transition-colors">
            <input type="radio" name="payment-method" value="Cash on Delivery" class="accent-emerald-600">
            <i data-lucide="banknote" class="w-6 h-6 text-green-600"></i>
            <span class="text-xs font-bold">Cash on Delivery</span>
          </label>
        </div>
      </div>
    </div>
    <!-- ORDER SUMMARY -->
    <div id="checkout-order-summary"></div>
  </div>
</div>

<footer class="bg-slate-900 text-slate-400 py-6 px-4 mt-12 text-center text-xs">
  <p>© 2026 FreshCart. Secure checkout powered by 256-bit SSL.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
